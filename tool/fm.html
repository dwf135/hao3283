<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌电台播放器</title>
<style>
/* =========================================================
   基础
   ========================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  padding:76px 16px 90px;
  display:flex;justify-content:center;align-items:flex-start;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  color:#2b2b2b;
  transition:background .5s,color .5s;
}

/* =========================================================
   皮肤切换栏
   ========================================================= */
.skin-bar{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  display:flex;gap:4px;z-index:300;
  padding:5px;border-radius:999px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  box-shadow:0 8px 28px rgba(0,0,0,.14);
  max-width:calc(100vw - 24px);
  overflow-x:auto;
  scrollbar-width:none;
}
.skin-bar::-webkit-scrollbar{display:none}
.skin-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;border:none;cursor:pointer;
  font-size:12.5px;font-weight:600;white-space:nowrap;
  background:transparent;color:#666;
  transition:all .22s;
}
.skin-btn .dot{width:12px;height:12px;border-radius:50%;flex:none}
.skin-btn.active{background:#1a1a1a;color:#fff}

/* =========================================================
   天气 & 访客
   ========================================================= */
.weather-card,.visitor-badge{
  position:fixed;z-index:250;
  display:flex;align-items:center;gap:7px;
  padding:9px 14px;border-radius:12px;
  font-size:12.5px;font-weight:600;
  background:#fff;color:#2b2b2b;
  box-shadow:0 6px 22px rgba(0,0,0,.13);
  transition:all .45s;
}
.weather-card{top:12px;right:14px}
.visitor-badge{left:14px;bottom:14px;max-width:280px}
.weather-card .w-icon{font-size:17px}
.weather-card .w-temp{font-weight:800}
.weather-card .w-city{font-weight:500;opacity:.65;font-size:11.5px}
.visitor-badge .v-text{line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visitor-badge .v-text b{font-weight:700}

/* =========================================================
   主体布局
   ========================================================= */
.app{
  display:flex;gap:22px;align-items:flex-start;
  width:100%;max-width:760px;justify-content:center;
  flex-wrap:wrap;
}

/* =========================================================
   播放器通用结构
   ========================================================= */
.player{
  width:340px;padding:18px 18px 16px;
  transition:all .45s;
  position:relative;
}
.brand-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:14px;font-weight:800;font-size:15px;
  transition:color .45s;
}
.brand-emoji{font-size:22px;line-height:1}

.screen{
  display:flex;gap:12px;align-items:center;
  padding:13px;border-radius:16px;
  transition:all .45s;
  position:relative;overflow:hidden;
}
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);
  opacity:.45;
}
.cover-box{
  position:relative;width:84px;height:84px;flex:none;
  border-radius:10px;overflow:hidden;
  background:rgba(0,0,0,.18);
  transition:all .45s;
}
.cover-fb{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:30px;opacity:.55;
}
.cover{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .35s;
}
.cover.ok{opacity:1}
.screen-body{min-width:0;flex:1;position:relative;z-index:1}
.scr-label{
  font-size:9px;font-weight:800;letter-spacing:2px;
  margin-bottom:6px;opacity:.6;
  transition:all .45s;
}
.scr-title{
  font-size:14.5px;font-weight:800;line-height:1.3;
  word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:38px;
  transition:all .45s;
}
.scr-sub{
  margin-top:5px;font-size:10.5px;font-weight:600;
  letter-spacing:.5px;opacity:.75;
  transition:all .45s;
}

/* 频谱条 */
.bars{display:flex;align-items:flex-end;gap:3px;height:18px;margin-top:7px}
.bars span{
  width:3px;height:4px;border-radius:1px;
  background:currentColor;opacity:.3;
  transition:opacity .2s,background .45s;
}
.playing .bars span{opacity:1;animation:eq .85s ease-in-out infinite alternate}
.bars span:nth-child(2){animation-duration:.62s}
.bars span:nth-child(3){animation-duration:1.05s}
.bars span:nth-child(4){animation-duration:.74s}
.bars span:nth-child(5){animation-duration:.92s}
.bars span:nth-child(6){animation-duration:.58s}
.bars span:nth-child(7){animation-duration:1.1s}
.bars span:nth-child(8){animation-duration:.7s}
@keyframes eq{from{height:4px}to{height:17px}}

/* 进度条 */
.strip{
  height:5px;margin:13px 2px 15px;border-radius:3px;
  overflow:hidden;background:rgba(0,0,0,.08);
  transition:background .45s;
}
.strip i{
  display:block;height:100%;width:38%;border-radius:3px;
  background:currentColor;opacity:.35;
  transition:background .45s;
}
.playing .strip i{opacity:.85;animation:scan 1.7s linear infinite}
@keyframes scan{from{transform:translateX(-38%)}to{transform:translateX(260%)}}

/* 控制按钮 */
.controls{display:flex;align-items:center;gap:11px}
.controls button{
  display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:var(--radius-btn,50%);
  border:1px solid transparent;cursor:pointer;
  font-size:13px;font-weight:700;
  transition:all .2s;
  font-family:inherit;
}
.controls button:hover{filter:brightness(1.06)}
.controls button:active{transform:translateY(2px) scale(.97)}
.controls .play{
  width:58px;height:58px;font-size:19px;
}
.vol-wrap{
  margin-left:auto;display:flex;align-items:center;gap:6px;
}
.vol-wrap span{
  font-size:9px;font-weight:800;letter-spacing:1px;opacity:.55;
  transition:color .45s;
}
.vol-wrap input{
  -webkit-appearance:none;appearance:none;
  width:70px;height:4px;border-radius:2px;
  background:rgba(0,0,0,.12);outline:none;cursor:pointer;
  transition:background .45s;
}
.vol-wrap input::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:currentColor;cursor:pointer;
  box-shadow:0 0 0 2px rgba(255,255,255,.6);
}
.vol-wrap input::-moz-range-thumb{
  width:13px;height:13px;border:none;border-radius:50%;
  background:currentColor;cursor:pointer;
}

/* =========================================================
   列表通用
   ========================================================= */
.playlist{
  width:330px;max-height:560px;
  display:flex;flex-direction:column;overflow:hidden;
  transition:all .45s;
}
.pl-head{
  padding:13px 16px 10px;flex:none;
  display:flex;justify-content:space-between;align-items:center;
  font-weight:800;font-size:12.5px;letter-spacing:.5px;
  transition:all .45s;
}
.pl-head b{font-weight:900}
.pl-search{flex:none;padding:0 12px 10px}
.pl-search input{
  width:100%;padding:9px 12px;border-radius:9px;outline:none;
  border:1px solid transparent;font-size:12.5px;
  transition:all .2s;
  font-family:inherit;
}
#list{
  list-style:none;margin:0;padding:5px 7px 8px;
  overflow-y:auto;flex:1;
}
#list::-webkit-scrollbar{width:6px}
#list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:3px}
#list::-webkit-scrollbar-track{background:transparent}
#list li{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  font-size:12.5px;font-weight:500;
  transition:all .15s;
  border:1px solid transparent;
}
#list li .num{
  flex:none;font-size:10px;font-weight:800;width:20px;
  opacity:.5;font-variant-numeric:tabular-nums;
  transition:all .45s;
}
#list li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list li:hover{transform:translateX(2px)}

/* =========================================================

   ========================================================= */

    radial-gradient(circle at 12% 14%, #ffe3e8 0, transparent 42%),

body[data-skin="mixue"] .skin-btn[data-s="mixue"].active{background:#e60012}
body[data-skin="mixue"] .player{

/* =========================================================
   皮肤切换
   ========================================================= */
const SKIN_KEY = 'radio_brand_skin';
const skinBar  = document.getElementById('skinBar');
const brandEmoji = document.getElementById('brandEmoji');
const brandTitle = document.getElementById('brandTitle');

// 生成按钮
SKINS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'skin-btn';
  btn.dataset.s = s.id;
  btn.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.name}`;
  btn.addEventListener('click', () => applySkin(s.id));
  skinBar.appendChild(btn);
});

function applySkin(id) {
  const skin = SKINS.find(s => s.id === id) || SKINS[0];
  document.body.dataset.skin = skin.id;
  brandEmoji.textContent = skin.emoji;
  brandTitle.textContent = skin.title;
  localStorage.setItem(SKIN_KEY, skin.id);
  [...skinBar.children].forEach(b => {
    b.classList.toggle('active', b.dataset.s === skin.id);
  });
}

// 恢复上次皮肤
const savedSkin = localStorage.getItem(SKIN_KEY);
applySkin(savedSkin && SKINS.some(s => s.id === savedSkin) ? savedSkin : 'mixue');

/* =========================================================
   元素引用
   ========================================================= */
const device   = document.getElementById('player');
const titleEl  = document.getElementById('title');
const subEl    = document.getElementById('sub');
const coverEl  = document.getElementById('cover');
const coverFb  = document.getElementById('coverFb');
const listEl   = document.getElementById('list');
const countEl  = document.getElementById('count');
const searchEl = document.getElementById('search');
const playBtn  = document.getElementById('play');
const prevBtn  = document.getElementById('prev');
const nextBtn  = document.getElementById('next');
const volEl    = document.getElementById('vol');

const audio = new Audio();
audio.preload = 'none';
audio.volume  = 0.8;

let cur = -1;

/* =========================================================
   渲染列表
   ========================================================= */
function render(keyword) {
  const kw = (keyword || '').trim().toLowerCase();
  listEl.innerHTML = '';
  let shown = 0;

  RADIOS.forEach((r, i) => {
    if (kw && !r[0].toLowerCase().includes(kw)) return;
    shown++;

    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = `<span class="num">${String(i + 1).padStart(2, '0')}</span>
                    <span class="nm">${r[0]}</span>`;
    if (i === cur) li.classList.add('active');
    li.addEventListener('click', () => play(i));
    listEl.appendChild(li);
  });

  countEl.textContent = shown;
}

/* =========================================================
   封面
   ========================================================= */
function setCover(src, name) {
  coverEl.classList.remove('ok');
  coverFb.textContent = name ? name.slice(0, 1) : '♪';
  coverEl.onload  = () => coverEl.classList.add('ok');
  coverEl.onerror = () => coverEl.classList.remove('ok');
  coverEl.src = src || '';
  if (!src) coverEl.classList.remove('ok');
}

/* =========================================================
   播放（统一 HTTPS）
   ========================================================= */
function play(i) {
  if (i < 0 || i >= RADIOS.length) return;
  cur = i;

  const [name, id, thumb] = RADIOS[i];
  titleEl.textContent = name;
  subEl.textContent   = 'LIVE · 正在连接…';
  setCover(thumb, name);

  audio.src = `https://lhttp.qingting.fm/live/${id}/64k.mp3`;
  audio.load();
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});

  [...listEl.children].forEach(li => {
    li.classList.toggle('active', Number(li.dataset.i) === i);
  });
  const active = listEl.querySelector('li.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* =========================================================
   音频事件
   ========================================================= */
audio.addEventListener('playing', () => {
  device.classList.add('playing');
  playBtn.textContent = '❚❚';
  subEl.textContent = 'LIVE · 正在播放';
});
audio.addEventListener('pause', () => {
  device.classList.remove('playing');
  playBtn.textContent = '▶';
  subEl.textContent = 'PAUSED · 已暂停';
});
audio.addEventListener('waiting', () => {
  if (cur >= 0) subEl.textContent = 'BUFFERING · 缓冲中…';
});
audio.addEventListener('error', () => {
  if (cur < 0) return;
  subEl.textContent = 'ERROR · 该电台暂不可播，请切下一台';
  device.classList.remove('playing');
  playBtn.textContent = '▶';
});

/* =========================================================
   按钮交互
   ========================================================= */
playBtn.addEventListener('click', () => {
  if (cur < 0) { play(0); return; }
  if (audio.paused) {
    const p = audio.play();
    if (p && p.catch) p.catch(() => play(cur));
  } else {
    audio.pause();
  }
});
prevBtn.addEventListener('click', () => {
  if (cur < 0) { play(0); return; }
  play((cur - 1 + RADIOS.length) % RADIOS.length);
});
nextBtn.addEventListener('click', () => {
  if (cur < 0) { play(0); return; }
  play((cur + 1) % RADIOS.length);
});
volEl.addEventListener('input', e => { audio.volume = e.target.value / 100; });
searchEl.addEventListener('input', e => render(e.target.value));

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  else if (e.code === 'ArrowLeft') prevBtn.click();
  else if (e.code === 'ArrowRight') nextBtn.click();
});

/* =========================================================
   IP 归属地 + 天气
   ========================================================= */
const visitorBadge = document.getElementById('visitorBadge');
const weatherCard  = document.getElementById('weatherCard');

async function initGeoAndWeather() {
  try {
    const res = await fetch('https://ipwho.is/');
    if (!res.ok) throw new Error('geo');
    const geo = await res.json();

    if (geo.success === false) throw new Error('geo fail');

    const city    = geo.city || '';
    const region  = geo.region || '';
    const country = geo.country || '';
    const locText = [country, region, city].filter(Boolean).join(' · ') || geo.ip || '未知位置';

    visitorBadge.querySelector('.v-text').innerHTML =
      `欢迎来自 <b>${locText}</b> 的访客`;

    if (typeof geo.latitude === 'number' && typeof geo.longitude === 'number') {
      await fetchWeather(geo.latitude, geo.longitude, city);
    } else {
      weatherCard.innerHTML = '<span class="w-icon">🌡️</span><span class="w-temp">--</span><span class="w-city">天气不可用</span>';
    }
  } catch (err) {
    visitorBadge.querySelector('.v-text').innerHTML = '<span>位置识别失败</span>';
    weatherCard.innerHTML = '<span class="w-icon">🌡️</span><span class="w-temp">--</span><span class="w-city">天气加载失败</span>';
  }
}

async function fetchWeather(lat, lon, cityName) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather');
    const data = await res.json();
    const w = data.current_weather;
    if (!w) throw new Error('no w');

    const temp = Math.round(w.temperature);
    const icon = weatherIcon(w.weathercode);

    weatherCard.innerHTML =
      `<span class="w-icon">${icon}</span>
       <span class="w-temp">${temp}°C</span>
       <span class="w-city">${cityName || ''}</span>`;
  } catch (e) {
    weatherCard.innerHTML = '<span class="w-icon">🌡️</span><span class="w-temp">--</span><span class="w-city">天气暂不可用</span>';
  }
}

function weatherIcon(code) {
  if (code === 0) return '☀️';
  if (code === 1 || code === 2) return '⛅';
  if (code === 3) return '☁️';
  if (code >= 45 && code <= 48) return '🌫️';
  if (code >= 51 && code <= 67) return '🌧️';
  if (code >= 71 && code <= 77) return '❄️';
  if (code >= 80 && code <= 82) return '🌦️';
  if (code >= 85 && code <= 86) return '🌨️';
  if (code >= 95 && code <= 99) return '⛈️';
  return '🌡️';
}

/* =========================================================
   初始化
   ========================================================= */
render();
initGeoAndWeather();
</script>
